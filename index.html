:root{--bg:#050506;--steel:#121214;--steel2:#18181b;--line:#232327;--text:#ececef;--mute:#7c7c86;--dim:#55555c;
  --acc:#F5D90A;--hot:#E8742A;--ok:#5DCAA5;--warn:#EF9F27;--bad:#E24B4A;--lcd:#020a05;--lcdline:#1d3a28}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Bootzy,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:22px 16px 40px}
.hidden{display:none!important}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
header img{height:34px;display:block}
.sub{font-size:13px;color:var(--mute);letter-spacing:.04em}
.tabs{margin-left:auto;display:flex;gap:6px}
.tab{padding:8px 18px;border-radius:8px;border:1px solid var(--line);color:var(--mute);font:inherit;font-size:14px;background:transparent;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#000}
button{font:inherit;cursor:pointer}
.oven{background:var(--steel);border:1px solid var(--line);border-radius:14px;padding:18px 22px 20px;position:relative}
.bolt{position:absolute;width:8px;height:8px;border-radius:50%;background:#26262a;border:1px solid #3a3a40}
.b1{left:9px;top:9px}.b2{right:9px;top:9px}.b3{left:9px;bottom:9px}.b4{right:9px;bottom:9px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.disp{background:#0b0402;border:1px solid #3a1d0a;border-radius:6px;padding:5px 12px;color:var(--warn);font-size:18px;letter-spacing:.08em;min-width:78px;text-align:center}
.mesa{font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:transparent;font-family:inherit}
.mesa b{color:#c9c9cf;font-weight:400;letter-spacing:.14em}
.mesa:hover{border-color:#3a3a40}
.spec{margin-left:auto;font-size:12px;color:var(--mute)}
.handle{height:10px;margin:0 60px 10px;border-radius:6px;background:linear-gradient(#5a5a60,#2c2c30);border:1px solid #444}
.window{height:150px;border-radius:14px;background:#0b0b0c;border:5px solid #2c2c30;position:relative;overflow:hidden}
.glow{position:absolute;inset:12px;border-radius:8px;background:#151517;transition:opacity .4s}
.window.on .glow{background:radial-gradient(ellipse at 50% 60%,#ffb347 0%,#E8742A 45%,#8a3a10 100%);animation:breathe 2.4s ease-in-out infinite}
.window.warm .glow{background:radial-gradient(ellipse at 50% 60%,#6a3510 0%,#3a1a08 70%,#1a0c04 100%)}
@keyframes breathe{0%,100%{filter:brightness(.92)}50%{filter:brightness(1.06)}}
.rack{position:absolute;left:12px;right:12px;top:62%;height:3px;background:rgba(0,0,0,.35)}
.state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#4a4a52;font-size:44px;letter-spacing:.06em;padding:0 16px}
.state small{font-size:13px;letter-spacing:.12em;opacity:.8;margin-top:2px}
.window.on .state{color:#2a0e00}
.window.warm .state{color:#c9864a}
.row{display:flex;gap:14px;align-items:flex-start;margin-top:16px;flex-wrap:wrap}
.knob{text-align:center;width:124px;user-select:none;touch-action:none}
.kw{position:relative;width:124px;height:92px;margin:0 auto;cursor:grab}
.kw:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.kn{position:absolute;left:36px;top:22px;width:52px;height:52px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#2a2a2e 0deg 6deg,#1c1c1f 6deg 12deg);
  box-shadow:0 6px 10px rgba(0,0,0,.65),0 2px 0 #0a0a0b,inset 0 1px 0 rgba(255,255,255,.08)}
.kn:before{content:'';position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#5a5a62 0%,#34343a 38%,#1e1e22 75%,#141416 100%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.12),inset 0 -3px 5px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.8)}
.kn:after{content:'';position:absolute;left:14px;top:9px;width:16px;height:9px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);pointer-events:none}
.kn span{position:absolute;left:24.5px;top:8px;width:3px;height:13px;background:var(--acc);border-radius:2px;transform-origin:1.5px 18px;transition:transform .15s;box-shadow:0 0 3px rgba(245,217,10,.5);z-index:1}
.kw:active .kn{box-shadow:0 4px 7px rgba(0,0,0,.65),0 1px 0 #0a0a0b,inset 0 1px 0 rgba(255,255,255,.08)}
.sl{position:absolute;font-size:12px;color:var(--dim);transform:translate(-50%,-50%);white-space:nowrap;cursor:pointer}
.sl.on{color:var(--acc)}
.nm{font-size:13px;color:#bdbdc4;letter-spacing:.1em}
.rd{display:inline-block;font-size:12px;color:var(--ok);background:var(--lcd);border:1px solid var(--lcdline);border-radius:4px;padding:3px 8px;margin-top:6px;white-space:nowrap}
.hint{font-size:11px;color:#5f5f68;margin-top:5px}
.knob.lock .kw{cursor:not-allowed;opacity:.55}
.meters{flex:1;min-width:260px;display:grid;grid-template-columns:16px 1fr 64px;gap:10px 8px;align-items:center;padding-top:26px}
.meters .l{font-size:13px;color:var(--mute)}
.bar{display:flex;gap:2px}.bar i{flex:1;height:12px;border-radius:2px;background:#1a1a1d}
.db{font-size:13px;text-align:right}
.mlab{grid-column:2;display:flex;justify-content:space-between;font-size:11px;color:#4d4d55;margin-top:-4px}
.prep{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px}
.f label{font-size:12px;color:var(--mute);letter-spacing:.06em}
select,input[type=text],input[type=password]{background:var(--steel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px;width:100%}
.btn{background:var(--steel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:14px}
.btn:hover{border-color:#3a3a40}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#000}
.btn.red{border-color:#5a1f1f;color:var(--bad)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text);white-space:nowrap;padding-bottom:9px}
.chk input{accent-color:var(--acc);width:16px;height:16px}
.msg{font-size:13px;padding:9px 12px;border-radius:8px;margin-top:12px;border:1px solid var(--line);background:var(--steel2);color:var(--text)}
.msg.err{border-color:#5a1f1f;color:#f09595}
.msg.ok{border-color:var(--lcdline);color:var(--ok)}
.orders{margin-top:20px}
.ohead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--mute);letter-spacing:.1em;margin-bottom:6px;flex-wrap:wrap}
.rail{height:3px;background:linear-gradient(#6a6a70,#3a3a40);border-radius:2px}
.tks{display:flex;gap:10px;padding:6px 4px 0;flex-wrap:wrap;min-height:34px}
.tk{background:#f3eee0;color:#222;padding:5px 9px 6px;font-size:12px;line-height:1.3;position:relative;transform:rotate(var(--r,0deg));transform-origin:top center;animation:drop .45s ease-out}
.tk:before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:12px;height:6px;background:#888;border-radius:1px}
.tk .ok{color:#0F6E56}.tk .sl2{color:#854F0B}
.tk.slow{background:#FAEEDA}
.empty{font-size:12px;color:var(--dim);padding:4px 2px}
@keyframes drop{from{transform:translateY(-14px) rotate(-6deg);opacity:0}to{transform:translateY(0) rotate(var(--r,0deg));opacity:1}}
.tapes{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:16px;flex-wrap:wrap;letter-spacing:.04em}
.tapes b{color:#c9c9cf;font-weight:400}
details{margin-top:14px}summary{cursor:pointer;color:var(--mute);font-size:13px}
details li{font-size:13px;color:var(--mute);margin:4px 0;line-height:1.5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
details li b{color:var(--text);font-weight:600}
.seat{max-width:620px}
.code5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.code5 input{text-align:center;font-size:28px;padding:10px 0;text-transform:uppercase;letter-spacing:0}
.code5 input:focus{outline:none;border-color:var(--acc)}
.foot{text-align:center;font-size:12px;color:var(--dim);margin-top:22px;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
@media (max-width:620px){.state{font-size:30px}.handle{margin:0 24px 10px}.oven{padding:16px 14px}.knob{width:110px}.kw{width:110px}.kn{left:31px}.spec{margin-left:0;width:100%}}
</style>
</head>

function makeMeters(el, ch) {

    feed(f32) { for (let c = 0; c < ch; c++) { let m = 0; for (let i = c; i < f32.length; i += ch) { const a = Math.abs(f32[i]); if (a > m) m = a; } const r = rows[c]; if (m > r.v) r.v = m; if (m >= r.hold) { r.hold = m; r.ht = performance.now(); } } },

  if (RX.conn) { try { RX.conn.close(); } catch (e) {} RX.conn = null; }
  if (RX.peer) { try { RX.peer.destroy(); } catch (e) {} RX.peer = null; }
  if (RX.meters) RX.meters.stop();
  if (RX.ctx) { try { RX.ctx.close(); } catch (e) {} }
  if (RX.ctx0 && RX.ctx0 !== RX.ctx) { try { RX.ctx0.close(); } catch (e) {} }
  RX.ctx = RX.ctx0 = null; RX.node = null; RX.cfg = null; RX.lvl = null; RX.under = 0; RX.lost = 0; RX.bytes = RX.lastBytes = 0; RX.rtt = null;
  $('rxClock').textContent = '--:--'; $('rxSpec').textContent = 'esperando la cocina';
  $('rxLive').classList.add('hidden'); $('rxSeat').classList.remove('hidden');
  msg($('rxMsg'), why ? esc(why) : '', why ? 'err' : '');
}

(async () => { try { if (navigator.brave && await navigator.brave.isBrave()) $('braveNote2').classList.remove('hidden'); } catch (e) {} })();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
